name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render site
        run: |
          curl -sS -o /dev/null -w "%{http_code} %{time_total}s\n" --max-time 60 https://proassets-main.onrender.com/ || true
