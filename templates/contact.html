<!doctype html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="container"><h1>Contact us</h1><p>Send us your question or feedback.</p><form method="post" onsubmit="sendMessage(event)"><div class="form-group"><label for="subject">Subject</label><input id="subject" name="subject" required maxlength="160"></div><div class="form-group"><label for="message">Message</label><textarea id="message" name="message" required maxlength="5000"></textarea></div><button class="btn" type="submit">Send message</button></form><p><a href="/">Back to home</a></p></main><script>async function sendMessage(e){e.preventDefault();const f=e.target;const r=await fetch('/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:f.subject.value,message:f.message.value})});const d=await r.json();alert(d.message);if(r.ok)f.reset();}</script></body></html>
